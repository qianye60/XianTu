<!doctype html>
<html lang="zh-CN">
  <head>
    <script>
      // IIFE to set the initial theme and prevent FOUC
      (function() {
        try {
          const theme = localStorage.getItem('theme');
          // If theme is not 'light', default to 'dark'
          if (theme !== 'light') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {
          console.warn('Could not set initial theme from localStorage:', e);
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="仙途 - AI驱动的修仙大世界。体验思维链AI、动态地图、开放预设系统、云端修行，开启你的AI修仙之旅。" />
    <meta name="keywords" content="仙途,AI游戏,AI驱动的游戏,AI修仙,AI大世界,修仙游戏,文字游戏,修仙世界,思维链AI,云端修行" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="仙途开发团队" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet" />
    <link rel="canonical" href="https://www.ddct.top/" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>仙途 - AI驱动的修仙大世界 | AI游戏</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      html,
      body,
      #app {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        overflow: auto;
      }
    </style>
    <script>
      // 全局定义Turnstile回调
      window.turnstileCallbacks = [];
      window.onTurnstileLoad = function() {
        console.log('[Turnstile] SDK已加载，调用所有回调');
        window.turnstileCallbacks.forEach(function(callback) {
          try {
            callback();
          } catch (error) {
            console.error('[Turnstile] 回调执行失败:', error);
          }
        });
      };
    </script>
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad"
      async
      defer
    ></script>
    <!-- Vue / Vue Router：开发模式用带 HMR 的构建，生产模式用 prod -->
    <script src="<%= vueScript %>"></script>
    <script src="<%= vueRouterScript %>"></script>
    <!-- Lodash CDN -->
    <script src="https://unpkg.com/lodash@4/lodash.min.js"></script>
    <!-- jQuery CDN -->
    <script src="https://unpkg.com/jquery@3/dist/jquery.min.js"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
